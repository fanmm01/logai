<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>顺风骑行 · 鹈鹕的海边日常</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Playfair+Display:ital,wght@1,500&display=swap');
    :root { color-scheme: light; --ink:#253d3c; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; display:grid; place-items:center; background:#f4f1e8; color:var(--ink); font-family:'Noto Sans SC',sans-serif; }
    main { width:min(1120px,100%); padding:42px 40px 24px; }
    header { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; }
    .brand { display:flex; align-items:center; gap:11px; font-size:12px; font-weight:700; letter-spacing:3px; }
    .brand i { width:27px; height:27px; border:1px solid var(--ink); border-radius:50%; display:grid; place-items:center; font-style:normal; font-size:18px; }
    .issue { font-size:10px; letter-spacing:2px; opacity:.6; }
    .scene { position:relative; overflow:hidden; border-radius:12px; background:#d9ebe5; box-shadow:0 18px 65px #3d594311; }
    .heading { position:absolute; left:5%; top:7%; z-index:1; pointer-events:none; }
    .eyebrow { font-size:10px; letter-spacing:3px; color:#557a70; }
    h1 { font-size:clamp(25px,4.4vw,51px); line-height:1.2; letter-spacing:3px; font-weight:500; margin:12px 0; }
    .heading p { font-size:12px; color:#648077; letter-spacing:1px; }
    .script { position:absolute; right:5%; top:8%; color:#748e7d; font:italic clamp(16px,2.5vw,29px) 'Playfair Display',Georgia,serif; transform:rotate(-7deg); }
    svg { width:100%; height:auto; display:block; }
    footer { display:flex; justify-content:space-between; gap:16px; align-items:center; margin-top:22px; }
    .caption { font-size:11px; letter-spacing:1px; color:#78847c; }
    button { font:inherit; font-size:11px; color:var(--ink); border:1px solid #c9d0c4; background:transparent; padding:9px 16px; border-radius:24px; cursor:pointer; display:flex; gap:8px; align-items:center; }
    button:hover { background:#e6eadd; }
    button:focus-visible { outline:2px solid #478b79; outline-offset:4px; }
    .wheel { animation:spin 1.35s linear infinite; transform-box:fill-box; transform-origin:center; }
    .rider { animation:bob 1.35s ease-in-out infinite; }
    .scarf-tail { animation:flutter .67s ease-in-out infinite alternate; transform-origin:527px 281px; }
    .bird { animation:soar 4s ease-in-out infinite alternate; }
    .bird.second { animation-delay:-2s; }
    .cloud { animation:drift 24s linear infinite; }
    .cloud.far { animation-duration:36s; animation-delay:-12s; }
    .road-marks { animation:road 1.35s linear infinite; }
    .shore { animation:shore 10s linear infinite; }
    .paused * { animation-play-state:paused !important; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(3px); } }
    @keyframes flutter { to { transform:rotate(-9deg); } }
    @keyframes soar { to { transform:translate(-18px,-9px); } }
    @keyframes drift { from { transform:translateX(70px); } to { transform:translateX(-100px); } }
    @keyframes road { to { transform:translateX(-180px); } }
    @keyframes shore { to { transform:translateX(-140px); } }
    @media(max-width:600px) { main { padding:24px 16px; } header { margin-bottom:20px; } .issue { letter-spacing:1px; } .scene { border-radius:8px; } .heading p { font-size:9px; } .eyebrow { font-size:8px; } h1 { margin:8px 0; } .caption { font-size:9px; } footer { margin-top:16px; } }
  </style>
</head>
<body>
  <main>
    <header><div class="brand"><i>≈</i> 慢 游 俱 乐 部</div><span class="issue">VOL. 01 / COASTAL RIDE</span></header>
    <section class="scene" aria-label="一只戴着绿色围巾的鹈鹕，骑着珊瑚红自行车沿海岸前行">

        <path d="M0 482Q380 466 1040 480V607Q500 592 0 614Z" fill="#eae6cf"/>
        <path d="M0 484Q480 471 1040 482" fill="none" stroke="#f5efdb" stroke-width="5"/>

        <g stroke="#93a479" stroke-width="2.5" stroke-linecap="round" fill="none"><path d="M50 477l-4-14m4 14 8-10m898-5 3-17m-3 17-8-9M164 629l3-16m-3 16-8-8m718 13 5-22m-5 22-8-12"/></g>
        <g fill="#b5be90"><ellipse cx="84" cy="617" rx="9" ry="2"/><ellipse cx="925" cy="490" rx="12" ry="2"/><ellipse cx="791" cy="625" rx="5" ry="2"/></g>
        <ellipse cx="533" cy="549" rx="217" ry="12" fill="#627b65" opacity=".13"/>
        <!-- Bicycle: two real rotating spoke assemblies and a diamond frame. -->
        <use href="#wheel" x="371" y="463"/><use href="#wheel" x="699" y="463"/>
        <g stroke-linejoin="round" stroke-linecap="round" fill="none">
          <path d="M371 463 451 336 505 463H371L633 353 505 463M633 353l66 110" stroke="#ad5f4d" stroke-width="11"/>
          <path d="M371 463 451 336 505 463H371L633 353 505 463M633 353l66 110" stroke="#dd896a" stroke-width="6"/>
          <path d="M448 336l-8-25m193 42-16-54q-3-9 9-12l29-6" stroke="#354f4b" stroke-width="7"/>
          <path d="M653 280l14-2" stroke="#a87754" stroke-width="10"/>
          <path d="M419 313q23-9 48-2" stroke="#354f4b" stroke-width="12"/>
          <path d="M348 374q-45 12-64 57m393-47q47-11 74 34" stroke="#e5b384" stroke-width="5"/>
          <path d="M328 373h-29m20 1 33 82" stroke="#648477" stroke-width="4"/>

        </g>
        <circle cx="505" cy="463" r="23" fill="#526b61" stroke="#e8d9b7" stroke-width="4"/>
        <circle cx="505" cy="463" r="15" fill="none" stroke="#aeb69a" stroke-width="2" stroke-dasharray="3 4"/>
        <!-- Far leg sits behind the body; both feet track their pedals. -->

          <path d="M618 285q10-6 15 1" fill="none" stroke="#e7b568" stroke-width="8" stroke-linecap="round"/>

        <path id="near-leg" d="M481 345 533 390 535 463" fill="none" stroke="#e1ad61" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <g id="near-pedal"><path id="crank" d="M505 463H535" stroke="#c7c7ad" stroke-width="6" stroke-linecap="round"/><path id="foot" d="M524 460h23l6 4h-29" fill="#edbd72" stroke="#9b7947" stroke-width="2" stroke-linejoin="round"/><path id="pedal" d="M523 468h25" stroke="#314b46" stroke-width="5" stroke-linecap="round"/></g>

    <footer><span class="caption">一只鹈鹕，一辆单车，一整天的好心情。</span><button id="toggle" type="button" aria-pressed="false"><span id="icon" aria-hidden="true">Ⅱ</span><span id="label">暂停片刻</span></button></footer>
  </main>
  <script>
    const scene = document.querySelector('.scene');
    const button = document.querySelector('#toggle');
    const farLeg = document.querySelector('#far-leg');
    const nearLeg = document.querySelector('#near-leg');
    const farPedal = document.querySelector('#far-pedal');
    const crank = document.querySelector('#crank');
    const foot = document.querySelector('#foot');
    const pedal = document.querySelector('#pedal');
    let paused = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let elapsed = 0, previous = null;
    function setPaused(value) {
      paused = value;
      scene.classList.toggle('paused', paused);
      button.setAttribute('aria-pressed', String(paused));
      document.querySelector('#icon').textContent = paused ? '▷' : 'Ⅱ';
      document.querySelector('#label').textContent = paused ? '继续兜风' : '暂停片刻';
    }
    button.addEventListener('click', () => setPaused(!paused));
    setPaused(paused);
    function animate(now) {
      if (previous !== null && !paused) elapsed += Math.min(now - previous, 80);
      previous = now;
      const angle = elapsed / 1350 * Math.PI * 2;
      const x = 505 + Math.cos(angle) * 32;
      const y = 463 + Math.sin(angle) * 32;
      const backX = 1010 - x, backY = 926 - y;
      const bob = 1.5 - 1.5 * Math.cos(angle);
      nearLeg.setAttribute('d', `M481 ${345 + bob} Q${x + 27} ${y - 57} ${x} ${y - 3}`);
      farLeg.setAttribute('d', `M471 ${343 + bob} Q${backX - 26} ${backY - 52} ${backX} ${backY - 3}`);
      farPedal.setAttribute('transform', `rotate(${angle * 180 / Math.PI} 505 463)`);
      // Far pedal assembly starts on the opposite side of the crank.
      crank.setAttribute('d', `M505 463L${x} ${y}`);
      foot.setAttribute('d', `M${x - 11} ${y - 4}h23l6 4h-29Z`);
      pedal.setAttribute('d', `M${x - 13} ${y + 4}h27`);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
